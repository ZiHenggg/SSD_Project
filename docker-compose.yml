services:
  # Nginx Reverse Proxy (acts as firewall/request filtering)
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
      # - "443:443"
      - "9000:9000"  # For reverse proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl  # For SSL certificates if needed
    depends_on:
      - php-app
      - splunk
    networks:
      - frontend
      - backend
    restart: unless-stopped

  # PHP Application (Business Logic & Session Management)
  php-app:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: php_business_logic
      ports:
        - "3306:3306"  # Exposed port as shown in diagram
      working_dir: /var/www/html
      depends_on:
        - mysql
      networks:
        - backend
      restart: unless-stopped
      environment:
        - PHP_FPM_USER=www-data
        - PHP_FPM_GROUP=www-data

  # MySQL Database (Data Storage & Retrieval + Encryption)
  mysql:
    image: mysql:8.0
    container_name: mysql_database
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

  # Splunk Enterprise (SIEM - Centralized Logs & Security Management)
  splunk:
    image: splunk/splunk:latest
    container_name: splunk_siem
    ports:
      - "8000:8000"  # Splunk Web UI
      - "8088:8088"  # HEC port
      - "9997:9997"  # Splunk forwarder port as shown in diagram
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
    volumes:
      - splunk_data:/opt/splunk/var
      # - ./splunk-config:/tmp/defaults
    networks:
      - backend
      - monitoring
    restart: unless-stopped

