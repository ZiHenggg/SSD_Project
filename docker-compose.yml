version: '3.8'

services:

  web:                                # PHP Web Server Container
    container_name: php-webapp
    build: .                          
    ports:
      - "8080:80"                     
    volumes:
      - .:/var/www                    
      - ./public:/var/www/html        
    restart: unless-stopped           
    depends_on:
      - db
      - redis                          # Ensure Redis starts before PHP app
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      REDIS_HOST: redis               # Optional: pass Redis host if you use env()

  db:                                 
    image: mysql:8.0
    container_name: mysql-ssd-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ssddb
      MYSQL_USER: ssduser
      MYSQL_PASSWORD: ssdpass
    ports:
      - "3308:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password

  redis:                              # Redis Service for rate-limiting
    image: redis:alpine
    container_name: redis
    restart: always
    expose:
      - "6379"                        # Only internal access; no external port needed

  adminer:                            # Optional DB GUI
    image: adminer
    restart: always
    ports:
      - "8081:8080"

  splunk:                             # Optional Log Collection
    image: splunk/splunk:latest
    container_name: splunk            
    hostname: splunk
    restart: always
    ports:
      - "8000:8000"
      - "8088:8088"
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD}
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN}
    volumes: 
      - splunk_data:/opt/splunk/var
      - splunk_etc:/opt/splunk/etc

  selenium:                           # Selenium Server for UI Testing
    image: selenium/standalone-chrome
    container_name: selenium-ui
    ports:
      - "4444:4444"
    shm_size: "2g"

volumes:
  splunk_data: 
    driver: local
  splunk_etc:
    driver: local
