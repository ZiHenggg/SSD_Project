version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./php/src:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - app-network
    depends_on:
      - php

  php:
    image: php:8.1-fpm-alpine # Using a specific PHP version
    container_name: php
    volumes:
      - ./php/src:/var/www/html
    networks:
      - app-network
    environment:
      # These variables are read BY your PHP application to connect to the DB
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASS}
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - db_data:/var/lib/mysql
      - db_logs:/var/log/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - app-network

  snort:
    image: dtagdevsec/snort3:latest
    container_name: snort
    network_mode: "service:nginx" # Monitors the Nginx container's network
    cap_add: [ "NET_ADMIN", "NET_RAW" ]
    volumes:
      - ./snort/local.rules:/etc/snort/rules/local.rules:ro
      - snort_logs:/var/log/snort

  splunk_forwarder:
    image: splunk/universalforwarder:latest
    container_name: splunk_forwarder
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_FORWARD_SERVER: ${SPLUNK_IP}:9997
      SPLUNK_USER: splunk
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
    volumes:
      - nginx_logs:/mnt/nginx_logs:ro
      - db_logs:/mnt/db_logs:ro
      - snort_logs:/mnt/snort_logs:ro
    depends_on: 
      - nginx
      - db
      - snort

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  db_logs:
  nginx_logs:
  snort_logs: