events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rate Limiting (DDoS Protection)
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_conn conn_limit_per_ip 20;

    # Logging format for security monitoring
    log_format security_log '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           '$request_time $upstream_response_time '
                           '$gzip_ratio $request_id';

    access_log /var/log/nginx/access.log security_log;
    error_log /var/log/nginx/error.log warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Hide Nginx version
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss;

    # Main server block - Reverse Proxy & Request Filtering
    server {
        listen 80;
        server_name localhost;
        
        # Document root
        root /var/www/html/public;
        index index.php index.html;

        # Request filtering - Block suspicious requests
        location ~* \.(aspx|jsp|cgi)$ {
            return 444;
        }

        # Block common attack patterns
        location ~* (eval\(|base64_decode|gzinflate|rot13|str_rot13) {
            return 444;
        }

        # Block SQL injection attempts
        location ~* (union.*select|insert.*into|delete.*from|drop.*table) {
            return 444;
        }

        # Rate limiting for login endpoints
        location ~* ^/(login|auth|signin) {
            limit_req zone=login burst=3 nodelay;
            limit_req_status 429;
            
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php-app:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # Rate limiting for API endpoints
        location ~* ^/api/ {
            limit_req zone=api burst=10 nodelay;
            limit_req_status 429;
            
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php-app:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # Main application - PHP Business Logic
        location / {
            limit_req zone=general burst=20 nodelay;
            
            # Try files first, then pass to PHP
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM configuration
        location ~ \.php$ {
            limit_req zone=general burst=20 nodelay;
            
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php-app:9000;
            fastcgi_index index.php;
            
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            
            # Security parameters
            fastcgi_param HTTP_PROXY "";
            fastcgi_hide_header X-Powered-By;
            
            # Timeout settings
            fastcgi_connect_timeout 60s;
            fastcgi_send_timeout 60s;
            fastcgi_read_timeout 60s;
        }

        # Static files handling
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Block access to sensitive files
        location ~* \.(htaccess|htpasswd|ini|log|sh|sql|conf)$ {
            deny all;
            return 404;
        }

        # Block access to hidden files
        location ~ /\. {
            deny all;
            return 404;
        }

        # Block access to backup files
        location ~* \~$ {
            deny all;
            return 404;
        }

        # Custom error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # Splunk SIEM access (Port 8088 for HEC, 9997 for forwarders)
    server {
        listen 8088;
        server_name localhost;
        
        location / {
            proxy_pass http://splunk:8088;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }



    # Health check endpoint
    server {
        listen 8080;
        server_name localhost;
        
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }
}