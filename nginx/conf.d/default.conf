# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name groupmates.bounceme.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Serve app over HTTPS
server {
    listen 443 ssl;
    server_name groupmates.bounceme.net;

    ssl_certificate /etc/letsencrypt/live/groupmates.bounceme.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/groupmates.bounceme.net/privkey.pem;

    location / {
        proxy_pass http://web:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
