name: Deploy to EC2 with Docker Compose

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      GH_PAT: ${{ secrets.GH_PAT }}
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      SPLUNK_HEC_TOKEN: ${{ secrets.SPLUNK_HEC_TOKEN }}
      SPLUNK_PASSWORD: ${{ secrets.SPLUNK_PASSWORD }}

    steps:
      - name: SSH to EC2 and deploy with Docker Compose
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          envs: DB_HOST,DB_NAME,DB_USER,DB_PASS,GH_PAT,EMAIL_USERNAME,EMAIL_PASSWORD,SPLUNK_HEC_TOKEN,SPLUNK_PASSWORD
          script: |
            echo "🔒 Masking sensitive values for logs"
            echo "::add-mask::$DB_PASS"
            echo "::add-mask::$EMAIL_PASSWORD"
            echo "::add-mask::$EMAIL_USERNAME"
            echo "::add-mask::$GH_PAT"
            echo "::add-mask::$SPLUNK_HEC_TOKEN"
            echo "::add-mask::$SPLUNK_PASSWORD"

            echo "🔎 Verifying essential environment variables..."
            echo "DB_HOST=$DB_HOST"
            echo "DB_NAME=$DB_NAME"
            echo "DB_USER=$DB_USER"
            echo "EMAIL_USERNAME=${EMAIL_USERNAME:0:3}***@***.com"
            echo "All other secrets masked ✅"

            echo "📁 Checking for project directory..."
            if [ ! -d "$HOME/ssd-project" ]; then
              echo "📥 Cloning production branch of repository with GH_PAT..."
              git clone --branch production https://$GH_PAT@github.com/mogaman/SSD_Project.git $HOME/ssd-project
            else
              echo "✅ Project directory exists."
              cd $HOME/ssd-project
              echo "🔄 Pulling latest changes from production branch..."
              git fetch origin production
              git reset --hard origin/production
              git clean -fdx
            fi

            cd $HOME/ssd-project
            echo "📁 Listing project files..."
            ls -la

            if [ ! -f "docker-compose-prod.yml" ]; then
              echo "❌ docker-compose-prod.yml not found!"
              exit 1
            fi

            if [ ! -f "composer.json" ]; then
              echo "❌ composer.json not found!"
              exit 1
            fi

            echo "✅ Creating .env.prod file"
            echo "DB_HOST=$DB_HOST" > .env.prod
            echo "DB_NAME=$DB_NAME" >> .env.prod
            echo "DB_USER=$DB_USER" >> .env.prod
            echo "DB_PASS=$DB_PASS" >> .env.prod
            echo "EMAIL_USERNAME=$EMAIL_USERNAME" >> .env.prod
            echo "EMAIL_PASSWORD=$EMAIL_PASSWORD" >> .env.prod
            echo "SPLUNK_HEC_TOKEN=$SPLUNK_HEC_TOKEN" >> .env.prod
            echo "SPLUNK_PASSWORD=$SPLUNK_PASSWORD" >> .env.prod

            echo "🛑 Stopping existing containers"
            sudo docker-compose --env-file .env.prod -f docker-compose-prod.yml down -v || true

            echo "📦 Installing PHP dependencies using the actual app container"
            sudo docker-compose --env-file .env.prod -f docker-compose-prod.yml run --rm web composer install --ignore-platform-req=ext-pdo_mysql

            echo "🚀 Starting containers (rebuilding everything)"
            sudo docker-compose --env-file .env.prod -f docker-compose-prod.yml up -d --build --force-recreate

            echo "✅ Deployment completed successfully."
