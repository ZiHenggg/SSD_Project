name: Deploy to EC2 (Test Flow)

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Upload project to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        source: "."
        target: "~/ssd-project"

    - name: SSH to EC2 and deploy with Docker Compose
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          cd ~/ssd-project
          sudo docker-compose down -v|| true
          docker run --rm -v $(pwd):/app -w /app alpine sh -c "rm -f /app/composer.lock"
          docker run --rm -v $(pwd):/app -w /app composer update --ignore-platform-req=ext-pdo_mysql
          sudo docker-compose up -d --build
