name: Deploy to EC2 with Docker Compose

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
      - name: SSH to EC2 and deploy with Docker Compose
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          envs: DB_HOST,DB_NAME,DB_USER,DB_PASS,GH_PAT
          script: |
            echo "🔎 Verifying env vars..."
            echo "DB_HOST=$DB_HOST"
            echo "DB_NAME=$DB_NAME"
            echo "DB_USER=$DB_USER"
            echo "DB_PASS=$DB_PASS"

            echo "📁 Checking for project directory..."
            if [ ! -d "$HOME/ssd-project" ]; then
              echo "📥 Cloning production branch of repository with GH_PAT..."
              git clone --branch production https://$GH_PAT@github.com/mogaman/SSD_Project.git $HOME/ssd-project
            else
              echo "✅ Project directory exists."
              cd $HOME/ssd-project
              echo "🔄 Pulling latest changes from production branch..."
              git reset --hard
              git clean -fd
              git pull origin production
            fi

            cd $HOME/ssd-project
            echo "📁 Listing project files..."
            ls -la

            if [ ! -f "docker-compose-prod.yml" ]; then
              echo "❌ docker-compose-prod.yml not found!"
              exit 1
            fi

            if [ ! -f "composer.json" ]; then
              echo "❌ composer.json not found!"
              exit 1
            fi

            echo "✅ Creating .env.prod file"
            echo "DB_HOST=$DB_HOST" > .env.prod
            echo "DB_NAME=$DB_NAME" >> .env.prod
            echo "DB_USER=$DB_USER" >> .env.prod
            echo "DB_PASS=$DB_PASS" >> .env.prod

            echo "🛑 Stopping existing containers"
            sudo docker-compose --env-file .env.prod -f docker-compose-prod.yml down -v || true

            echo "🧹 Cleaning composer.lock"
            docker run --rm -v $(pwd):/app -w /app alpine sh -c "rm -f /app/composer.lock"

            echo "📦 Running composer update"
            docker run --rm -v $(pwd):/app -w /app composer update --ignore-platform-req=ext-pdo_mysql

            echo "🚀 Starting containers"
            sudo docker-compose --env-file .env.prod -f docker-compose-prod.yml up -d --build
