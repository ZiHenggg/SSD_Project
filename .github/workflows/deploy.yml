- name: SSH to EC2 and deploy with Docker Compose
  uses: appleboy/ssh-action@master
  with:
    host: ${{ secrets.EC2_HOST }}
    username: ${{ secrets.EC2_USER }}
    key: ${{ secrets.EC2_KEY }}
    envs: DB_HOST,DB_NAME,DB_USER,DB_PASS   # ✅ This line is critical
    script: |
      cd ~/ssd-project

      # ✅ Securely create .env.prod from GitHub Secrets
      cat > .env.prod <<EOF
DB_HOST=${DB_HOST}
DB_NAME=${DB_NAME}
DB_USER=${DB_USER}
DB_PASS=${DB_PASS}
EOF

      sudo docker-compose -f docker-compose-prod.yml down -v || true
      docker run --rm -v $(pwd):/app -w /app alpine sh -c "rm -f /app/composer.lock"
      docker run --rm -v $(pwd):/app -w /app composer update --ignore-platform-req=ext-pdo_mysql
      sudo docker-compose -f docker-compose-prod.yml up -d --build
