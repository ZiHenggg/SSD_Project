name: 🚀 Deploy to EC2

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🔐 Set up SSH
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: 🚀 Deploy to EC2
        run: |
          echo "🔎 Verifying env vars..."
          echo "DB_HOST=$DB_HOST"
          echo "DB_NAME=$DB_NAME"
          echo "DB_USER=$DB_USER"
          echo "DB_PASS=$DB_PASS"

          ssh -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            echo "🔍 Checking if project folder exists..."
            if [ ! -d "$HOME/ssd-project" ]; then
              echo "📁 Project folder not found. Cloning..."
              git clone https://github.com/mogaman/SSD_Project.git $HOME/ssd-project
            else
              echo "✅ Project folder exists."
            fi

            cd $HOME/ssd-project

            echo "✅ Creating .env.prod file"
            echo "DB_HOST=${{ secrets.DB_HOST }}" > .env.prod
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env.prod
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env.prod
            echo "DB_PASS=${{ secrets.DB_PASS }}" >> .env.prod

            echo "🛑 Stopping existing containers"
            sudo docker-compose --env-file .env.prod -f docker-compose-prod.yml down -v || true

            echo "🧹 Cleaning composer.lock"
            docker run --rm -v $(pwd):/app -w /app alpine sh -c "rm -f /app/composer.lock"

            echo "📦 Running composer update"
            docker run --rm -v $(pwd):/app -w /app composer update --ignore-platform-req=ext-pdo_mysql

            echo "🚀 Starting containers"
            sudo docker-compose --env-file .env.prod -f docker-compose-prod.yml up -d --build
          EOF
