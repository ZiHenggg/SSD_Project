name: Run Playwright UI Tests

on:
  workflow_call:
    
jobs:
  playwright:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ssddb
          MYSQL_USER: ssduser
          MYSQL_PASSWORD: ssdpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Create .env for CI
        run: |
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_NAME=ssddb" >> .env
          echo "DB_USER=ssduser" >> .env
          echo "DB_PASS=ssdpass" >> .env
          echo "REDIS_HOST=127.0.0.1" >> .env

      - name: Install PHP dependencies (Composer)
        run: composer install --no-interaction --prefer-dist

      - name: Seed database using init.sql
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          mysql -h 127.0.0.1 -u root -proot < init.sql

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Node dependencies
        run: |
          cd tests/UI
          npm ci
          npx playwright install --with-deps

      - name: Start PHP server
        run: php -S 127.0.0.1:8080 -t public > /dev/null 2>&1 &
        working-directory: .

      - name: Run Playwright tests
        env:
          DEBUG: pw:browser*
        run: |
          cd tests/UI
          npx playwright test

      - name: ✅ Write UI Test Summary
        run: |
          echo "### ✅ Registration Flow UI Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "This workflow validates the UI for the student registration process using Playwright:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**📄 Registration Form**" >> $GITHUB_STEP_SUMMARY
          echo "- Fills form fields with valid student details" >> $GITHUB_STEP_SUMMARY
          echo "- Submits registration and expects OTP form to render" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🧪 OTP UI Handling**" >> $GITHUB_STEP_SUMMARY
          echo "- Confirms visibility of OTP input field" >> $GITHUB_STEP_SUMMARY
          echo "- Confirms 'Resend OTP' button appears" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✔️ Registration page UI and OTP step simulated in CI without triggering email" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### ✅ Login + 2FA UI Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "This workflow validates the login page UI including redirects for 2FA and non-2FA users:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🔐 2FA-Enabled User Flow**" >> $GITHUB_STEP_SUMMARY
          echo "- Enters valid credentials for user with 2FA" >> $GITHUB_STEP_SUMMARY
          echo "- Redirected to /verify_2fa.php" >> $GITHUB_STEP_SUMMARY
          echo "- Enters valid OTP (generated from known TOTP secret)" >> $GITHUB_STEP_SUMMARY
          echo "- Redirected to dashboard after successful 2FA" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🔓 Non-2FA User Flow**" >> $GITHUB_STEP_SUMMARY
          echo "- Enters valid credentials for user without 2FA" >> $GITHUB_STEP_SUMMARY
          echo "- Redirected to /setup_2fa.php for initial 2FA setup" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✔️ Login and 2FA behavior verified for both flows using Playwright" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🧪 Technical Details & Environment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🐘 MySQL and Redis services started using GitHub Actions containers" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 init.sql is used to pre-seed known test users with hardcoded credentials + secrets" >> $GITHUB_STEP_SUMMARY
          echo "- ⚙️ .env file dynamically generated during workflow" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 Application served locally using PHP's built-in server (http://localhost:8080)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✔️ All Playwright UI tests passed successfully in CI" >> $GITHUB_STEP_SUMMARY
