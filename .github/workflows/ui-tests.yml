name: 🧪 Selenium UI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ui-test:
    name: Run Selenium UI Tests against Docker WebApp
    runs-on: ubuntu-latest

    services:
      selenium:
        image: selenium/standalone-chrome
        ports:
          - 4444:4444

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: 📦 Install Composer Dependencies
        run: composer install --no-progress

      - name: 🏗️ Build and Run WebApp Container
        run: |
          docker build -t php-webapp .
          docker run -d -p 8080:80 --name php-webapp php-webapp
          sleep 5 # allow PHP container to start up

      - name: 🧪 Run RegisterTest
        run: php tests/ui/RegisterTest.php

      - name: 🧪 Run Login and 2FA Tests
        run: php tests/ui/LoginWith2FATest.php

      - name: 🧹 Stop WebApp Container
        run: docker stop php-webapp

      - name: ✅ Write UI Test Summary
        run: |
          echo "### ✅ Registration Flow UI Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "This workflow verifies the UI behavior for user registration and OTP handling:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**📝 Registration Form**" >> $GITHUB_STEP_SUMMARY
          echo "- Fills out student ID, name, email, password" >> $GITHUB_STEP_SUMMARY
          echo "- Submits the form and moves to OTP page" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🔐 OTP Verification**" >> $GITHUB_STEP_SUMMARY
          echo "- Enters correct OTP (`123456`) and submits" >> $GITHUB_STEP_SUMMARY
          echo "- Verifies that registration is completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🔁 OTP Resend**" >> $GITHUB_STEP_SUMMARY
          echo "- Clicks 'Resend OTP' button" >> $GITHUB_STEP_SUMMARY
          echo "- Verifies OTP input is still present" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**✅ Success Flow**" >> $GITHUB_STEP_SUMMARY
          echo "- Verifies that success modal is visible or redirects to login" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✔️ All registration-related UI tests passed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### ✅ Login and 2FA UI Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "This workflow verifies the UI behavior for Login and Two-Factor Authentication (2FA):" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**📝 Login Flow**" >> $GITHUB_STEP_SUMMARY
          echo "- Valid email and password submission" >> $GITHUB_STEP_SUMMARY
          echo "- Redirects to the 2FA setup or dashboard based on user status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🔐 2FA Setup Flow**" >> $GITHUB_STEP_SUMMARY
          echo "- Displays QR code for Google Authenticator" >> $GITHUB_STEP_SUMMARY
          echo "- Simulates OTP entry and redirects to verify 2FA" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**✅ 2FA Verification**" >> $GITHUB_STEP_SUMMARY
          echo "- Simulates entering the correct 6-digit OTP for verification" >> $GITHUB_STEP_SUMMARY
          echo "- Verifies successful login and redirection to dashboard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**❌ Invalid Login and 2FA Error Handling**" >> $GITHUB_STEP_SUMMARY
          echo "- Tests invalid login credentials and incorrect OTP handling" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✔️ All login and 2FA-related UI tests passed successfully!" >> $GITHUB_STEP_SUMMARY
