name: Run Playwright UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  playwright:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ssddb
          MYSQL_USER: ssduser
          MYSQL_PASSWORD: ssdpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Create .env for CI
        run: |
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_NAME=ssddb" >> .env
          echo "DB_USER=ssduser" >> .env
          echo "DB_PASS=ssdpass" >> .env
          echo "REDIS_HOST=127.0.0.1" >> .env

      - name: Install PHP dependencies (Composer)
        run: composer install --no-interaction --prefer-dist

      - name: Seed database using init.sql
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          mysql -h 127.0.0.1 -u root -proot < init.sql

      - name: 🕵️ Verify seeded users and password hash
        run: |
          echo "✅ Checking seeded users in 'students' table..."
          mysql -h 127.0.0.1 -u root -proot ssddb -e \
          "SELECT studentId, email, is_2fa_enabled, email_verified, password FROM students WHERE studentId IN (1234567, 7654321);"

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Node dependencies
        run: |
          cd tests/UI
          npm ci
          npx playwright install --with-deps

      - name: Start PHP server
        run: php -S 127.0.0.1:8080 -t public > /dev/null 2>&1 &
        working-directory: .

      - name: Run Playwright tests
        env:
          DEBUG: pw:browser*
        run: |
          cd tests/UI
          npx playwright test

      - name: Summary
        run: |
          echo "### ✅ Playwright UI Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Registration & Login flows tested using Chromium + Playwright" >> $GITHUB_STEP_SUMMARY
          echo "- Registration test fills form and confirms OTP input appears" >> $GITHUB_STEP_SUMMARY
          echo "- Login test handles both 2FA and non-2FA redirects" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🐘 MySQL and Redis services bootstrapped via GitHub Actions services" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 Application served at http://localhost:8080 using PHP built-in server" >> $GITHUB_STEP_SUMMARY
          echo "- ⚙️ .env file created dynamically for CI compatibility" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 init.sql executed and student table verified" >> $GITHUB_STEP_SUMMARY
