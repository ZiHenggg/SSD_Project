name: 🧪 Selenium UI Tests (Docker)

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  ui-test:
    name: Run Selenium UI Tests against Docker WebApp
    runs-on: ubuntu-latest

    services:
      selenium:
        image: selenium/standalone-chrome
        ports:
          - 4444:4444

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: 📦 Install Composer Dependencies
        run: composer install --no-progress

      - name: 🏗️ Build and Run WebApp Container
        run: |
          docker build -t php-webapp .
          docker run -d -p 8080:80 --name php-webapp php-webapp

      - name: ⏳ Wait for register.php to be reachable
        run: |
          for i in {1..20}; do
            echo "⏳ Checking app on localhost:8080/register.php (try $i)..."
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:8080/register.php || echo 000)
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ register.php is reachable (HTTP 200)!"
              break
            fi
            sleep 2
          done

      - name: 🧪 Run RegisterTest
        run: php tests/ui/RegisterTest.php

      - name: 🧹 Stop WebApp Container
        run: docker stop php-webapp
