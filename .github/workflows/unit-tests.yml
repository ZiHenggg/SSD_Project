name: Run PHPUnit Unit Tests for Registration and Input Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run PHPUnit Tests for Registration + OTP
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, redis
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit tests
        run: ./vendor/bin/phpunit --configuration phpunit.xml

      - name: ✅ Write Unit Test Summary
        run: |
          echo "### ✅ Unit Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "- StudentPageController: Input validation for registration fields" >> $GITHUB_STEP_SUMMARY
          echo "- StudentControl: Session storage, password hashing, and OTP generation" >> $GITHUB_STEP_SUMMARY
          echo "- OtpVerificationTest: OTP verification with valid, expired, and invalid inputs" >> $GITHUB_STEP_SUMMARY
          echo "- OtpFlowTest: OTP resend regenerates new OTP and calls sendOtpEmail()" >> $GITHUB_STEP_SUMMARY
          echo "- RateLimitTest: Blocks after:" >> $GITHUB_STEP_SUMMARY
          echo "  • 10 registration attempts (per IP)" >> $GITHUB_STEP_SUMMARY
          echo "  • 5 OTP verification failures (per email)" >> $GITHUB_STEP_SUMMARY
          echo "  • 3 OTP resend requests (per email)" >> $GITHUB_STEP_SUMMARY
          echo "- ✔️ All tests executed in CI with MySQL & Redis containers" >> $GITHUB_STEP_SUMMARY
