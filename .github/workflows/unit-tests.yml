name: Run PHPUnit Unit Tests for WebApp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run PHPUnit Tests for Registration + OTP + Login + Group + Review & Reply Flow + Update Password
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser  
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, redis
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit tests
        run: ./vendor/bin/phpunit --configuration phpunit.xml

      - name: ✅ Write Unit Test Summary
        run: |
          echo "### ✅ Registration Flow Unit Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "This workflow verifies all backend logic for the user registration process:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🧾 Input Validation**" >> $GITHUB_STEP_SUMMARY
          echo "- Validates student ID, name, password strength, and SIT email format" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🔐 Registration Process**" >> $GITHUB_STEP_SUMMARY
          echo "- Stores registration data in session" >> $GITHUB_STEP_SUMMARY
          echo "- Hashes password before storage" >> $GITHUB_STEP_SUMMARY
          echo "- Generates and sends 6-digit OTP to SIT email address" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**✅ OTP Verification**" >> $GITHUB_STEP_SUMMARY
          echo "- Accepts correct OTP and completes registration" >> $GITHUB_STEP_SUMMARY
          echo "- Fails on expired or invalid OTP" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🔁 OTP Resend**" >> $GITHUB_STEP_SUMMARY
          echo "- Regenerates and resends OTP if valid session exists" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🚫 Rate Limiting Protection**" >> $GITHUB_STEP_SUMMARY
          echo "- Blocks excessive registration, OTP verification, and resend attempts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✔️ All registration-related tests passed using GitHub Actions CI with MySQL & Redis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### ✅ Login Flow Unit Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "This workflow validates the student login process under different scenarios:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🚫 Invalid Credentials**" >> $GITHUB_STEP_SUMMARY
          echo "- Login fails with non-existent SIT email" >> $GITHUB_STEP_SUMMARY
          echo "- Login fails with incorrect password" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🔐 Valid Login**" >> $GITHUB_STEP_SUMMARY
          echo "- 2FA enabled → session stores pending email & redirects to verify_2fa.php" >> $GITHUB_STEP_SUMMARY
          echo "- 2FA not enabled → redirects to setup_2fa.php & initializes session" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🚫 Login Rate Limiting**" >> $GITHUB_STEP_SUMMARY
          echo "- Blocks login if user or IP exceeds failed attempt threshold" >> $GITHUB_STEP_SUMMARY
          echo "- Resets counters after successful login" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✔️ All login-related tests passed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### ✅ Two-Factor Authentication (2FA) Unit Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "This ensures correct setup and validation of TOTP-based 2FA with Google Authenticator:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🧷 2FA Setup Flow**" >> $GITHUB_STEP_SUMMARY
          echo "- Generates a secret and QR code image" >> $GITHUB_STEP_SUMMARY
          echo "- Verifies the scanned code from user input" >> $GITHUB_STEP_SUMMARY
          echo "- Enables 2FA by storing the secret in DB" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🔐 2FA Code Verification**" >> $GITHUB_STEP_SUMMARY
          echo "- Validates submitted code using TOTP secret" >> $GITHUB_STEP_SUMMARY
          echo "- Grants access on correct code, shows error otherwise" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✔️ 2FA setup & verification tested via StudentControl logic" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### ✅ Forgot Password Flow Unit Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "This section covers the complete password recovery process with OTP and Redis limits:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**📧 Email Submission**" >> $GITHUB_STEP_SUMMARY
          echo "- Validates email format and account existence" >> $GITHUB_STEP_SUMMARY
          echo "- Sends 6-digit OTP and sets session state" >> $GITHUB_STEP_SUMMARY
          echo "- Blocks excessive attempts by IP address" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🔁 OTP Resend Logic**" >> $GITHUB_STEP_SUMMARY
          echo "- Resends OTP if under 3-attempt limit" >> $GITHUB_STEP_SUMMARY
          echo "- Blocks excessive resend attempts per email" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🔐 OTP Verification**" >> $GITHUB_STEP_SUMMARY
          echo "- Accepts correct OTP and transitions to password reset" >> $GITHUB_STEP_SUMMARY
          echo "- Blocks incorrect OTP after 5 tries with Redis TTL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🔒 Password Reset**" >> $GITHUB_STEP_SUMMARY
          echo "- Updates password in database securely" >> $GITHUB_STEP_SUMMARY
          echo "- Disables 2FA to require re-setup after reset" >> $GITHUB_STEP_SUMMARY
          echo "- Clears OTP + resend rate limits post-reset" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✔️ Forgot password flow tested with session and Redis logic simulation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### ✅ Group Flow Unit Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "This section covers group creation, deletion, and rate-limiting behavior:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**➕ Group Creation**" >> $GITHUB_STEP_SUMMARY
          echo "- Creates group with valid form data" >> $GITHUB_STEP_SUMMARY
          echo "- Validates required fields (acad year, trimester, module, size)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**❌ Rate Limiting**" >> $GITHUB_STEP_SUMMARY
          echo "- Simulates Redis-based limit on group creation" >> $GITHUB_STEP_SUMMARY
          echo "- Blocks creation after threshold is hit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🗑️ Group Deletion**" >> $GITHUB_STEP_SUMMARY
          echo "- Soft-deletes group and sets session success message" >> $GITHUB_STEP_SUMMARY
          echo "- Handles invalid delete inputs gracefully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✔️ Group create/delete + rate-limit tests passed using mock repositories" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### ✅ Group Join Request Flow Unit Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "This section covers group join requests from members and approvers:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**📨 Send Join Request**" >> $GITHUB_STEP_SUMMARY
          echo "- Submits valid join request from student to group" >> $GITHUB_STEP_SUMMARY
          echo "- Blocks duplicate or accepted requests" >> $GITHUB_STEP_SUMMARY
          echo "- Simulates Redis-based rate limit for requests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**✅ Accept Join Request**" >> $GITHUB_STEP_SUMMARY
          echo "- Approver accepts join request" >> $GITHUB_STEP_SUMMARY
          echo "- Adds student to group, updates group count" >> $GITHUB_STEP_SUMMARY
          echo "- Removes remaining requests if group becomes full" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**❌ Reject Join Request**" >> $GITHUB_STEP_SUMMARY
          echo "- Rejects request and sets appropriate status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🗑️ Remove Join Request**" >> $GITHUB_STEP_SUMMARY
          echo "- Student can cancel pending join request" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✔️ All group join request scenarios validated in isolation" >> $GITHUB_STEP_SUMMARY

          echo "### ✅ Review & Reply Flow Unit Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "This workflow verifies the Review and Reply functionalities including:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Submitting valid reviews and replies" >> $GITHUB_STEP_SUMMARY
          echo "- Handling missing or invalid input gracefully" >> $GITHUB_STEP_SUMMARY
          echo "- Rejecting duplicate replies and replies from outside groups" >> $GITHUB_STEP_SUMMARY
          echo "- Proper exception handling for invalid submissions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✔️ All review and reply-related tests passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### ✅ Update Password Flow Unit Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "This workflow verifies the password update functionality including:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Successful password update with correct old password and SIT email validation" >> $GITHUB_STEP_SUMMARY
          echo "- Throws exceptions when student email not found or old password is incorrect" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✔️ All update password-related tests passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
