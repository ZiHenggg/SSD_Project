name: Run PHPUnit Unit Tests for Registration Flow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run PHPUnit Tests for Registration + OTP
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, redis
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit tests
        run: ./vendor/bin/phpunit --configuration phpunit.xml

      - name: ✅ Write Unit Test Summary
        run: |
          echo "### ✅ Registration Flow Unit Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "This workflow verifies all backend logic for the user registration process:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🧾 Input Validation**" >> $GITHUB_STEP_SUMMARY
          echo "- StudentPageController: Validates student ID, name, password, and SIT email format" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🔐 Registration Process**" >> $GITHUB_STEP_SUMMARY
          echo "- StudentControl: Stores registration data in session" >> $GITHUB_STEP_SUMMARY
          echo "- Hashes password before storage" >> $GITHUB_STEP_SUMMARY
          echo "- Generates and sends 6-digit OTP to SIT email address" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**✅ OTP Verification**" >> $GITHUB_STEP_SUMMARY
          echo "- Accepts correct OTP and completes registration" >> $GITHUB_STEP_SUMMARY
          echo "- Fails on expired or invalid OTP" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🔁 OTP Resend**" >> $GITHUB_STEP_SUMMARY
          echo "- Triggers new OTP generation and email on resend" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🚫 Rate Limiting Protection**" >> $GITHUB_STEP_SUMMARY
          echo "- Blocks after exceeding the following thresholds:" >> $GITHUB_STEP_SUMMARY
          echo "  • 10 registration attempts per IP (10 min lockout)" >> $GITHUB_STEP_SUMMARY
          echo "  • 5 incorrect OTP attempts per email (5 min lockout)" >> $GITHUB_STEP_SUMMARY
          echo "  • 3 OTP resends per email (15 min lockout)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✔️ All tests passed using GitHub Actions CI with MySQL & Redis services" >> $GITHUB_STEP_SUMMARY
