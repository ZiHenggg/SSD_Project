name: OWASP Dependency Check

on:
  workflow_call:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "groupmates"
          path: "."
          format: "HTML"
          out: "dependency-check-report"

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: Dependency-Check-Report
          path: dependency-check-report

      - name: ✅ Write Dependency Check Summary
        run: |
          echo "### ✅ OWASP Dependency Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "Scans the project for known vulnerable dependencies using OWASP Dependency-Check." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 Analyzes `composer.lock`, PHP dependencies, and transitive packages" >> $GITHUB_STEP_SUMMARY
          echo "- 🛡 Cross-references against the National Vulnerability Database (NVD)" >> $GITHUB_STEP_SUMMARY
          echo "- 📄 Generates an HTML report of any CVEs or security risks found" >> $GITHUB_STEP_SUMMARY
          echo "- 📂 Full report is uploaded as an artifact (Dependency-Check-Report)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✔️ Dependency scan completed successfully using GitHub Actions" >> $GITHUB_STEP_SUMMARY
